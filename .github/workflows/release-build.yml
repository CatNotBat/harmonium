name: release-build
# Build the release archives in the pinned container, unsigned. Signing happens only on the
# maintainer's machine (scripts/release.sh), so no key ever reaches CI.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [Containerfile, scripts/release.sh, Cargo.lock]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the toolchain image
        run: docker build -t harmonium-build -f Containerfile .
      - name: Build and package both targets
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -e HOME=/tmp
          -e CARGO_TARGET_DIR=/src/target/container harmonium-build
          scripts/release.sh --no-sign
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harmonium-unsigned
          path: out/release/
          if-no-files-found: error
